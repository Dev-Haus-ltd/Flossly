version: "3.9"

services:
  flossly:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/documents:/app/public/documents
      - ./public/leave-documents:/app/public/leave-documents
      - ./public/systemDocs:/app/public/systemDocs
      - ./public/images:/app/public/images
