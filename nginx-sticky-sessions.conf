# Nginx configuration for sticky sessions with transcription
# This ensures all requests for a transcription session go to the same backend process
# 
# To use this configuration:
# 1. Copy the relevant parts to your nginx configuration file
# 2. Update the server_name and upstream server address
# 3. Reload nginx: sudo nginx -t && sudo systemctl reload nginx

upstream flossly_backend {
    # Use ip_hash for IP-based sticky sessions
    # All requests from the same IP will go to the same backend process
    # This ensures transcription sessions stay on the same process
    ip_hash;
    
    # PM2 cluster mode uses a single port with internal load balancing
    # All instances share the same port, PM2 handles distribution
    server 127.0.0.1:3000;
    
    # Keep connections alive for better performance
    keepalive 32;
}

server {
    listen 80;
    server_name dev.flossly.ai;  # Update with your domain
    
    # Increase timeouts for long-running SSE connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    
    # Increase body size for audio chunks
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Disable buffering for Server-Sent Events (SSE)
    proxy_buffering off;
    proxy_cache off;
    
    # Transcription streaming endpoint - needs special handling
    location /api/transcription/stream {
        proxy_pass http://flossly_backend;
        proxy_http_version 1.1;
        
        # Essential headers for SSE
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        
        # Timeouts for long connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Transcription chunk endpoint - needs sticky sessions
    location /api/transcription/chunk {
        proxy_pass http://flossly_backend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserve cookies for sticky sessions
        proxy_set_header Cookie $http_cookie;
    }
    
    # All other API endpoints
    location /api/ {
        proxy_pass http://flossly_backend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        
        # Preserve cookies
        proxy_set_header Cookie $http_cookie;
    }
    
    # Static files and other routes
    location / {
        proxy_pass http://flossly_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }
}


